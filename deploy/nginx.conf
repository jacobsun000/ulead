limit_req_zone $binary_remote_addr zone=ulead_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ulead_contact:10m rate=10r/m;
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name ulead-edu.com;
    return 308 https://www.ulead-edu.com$request_uri;
}
server {
    listen 80;
    server_name www.ulead-edu.com admin.ulead-edu.com;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
    location = /api/login/ {
        limit_req zone=ulead_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/contact/ {
        limit_req zone=ulead_contact burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
